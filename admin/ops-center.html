<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>华伴运营巡检中心</title>
  <style>
    :root {
      --ink: #111820;
      --muted: #737b83;
      --line: rgba(17, 24, 32, .08);
      --green: #18c56e;
      --red: #e63b3b;
      --amber: #c77800;
      --bg: #f4f6f5;
      --panel: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      padding: 22px 14px 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1, h2, p { margin: 0; }

    h1 { font-size: 22px; }

    button {
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #041309;
      font-weight: 950;
    }

    .hero,
    .panel {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .hero {
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #f0fff6;
      color: #096b39;
      font-weight: 950;
      font-size: 13px;
    }

    .status.warning {
      background: #fff7e8;
      color: var(--amber);
    }

    .status.blocked {
      background: #fff0f0;
      color: var(--red);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      padding: 10px;
      border-radius: 8px;
      background: #f8faf9;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .stat b {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-size: 19px;
    }

    .panel {
      margin-top: 12px;
    }

    .panel h2 {
      margin-bottom: 8px;
      font-size: 16px;
    }

    .row {
      min-height: 50px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      font-weight: 850;
    }

    .row:first-of-type { border-top: 0; }

    .row small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .ok { color: var(--green); }
    .bad { color: var(--red); }
    .meta { color: var(--muted); font-size: 12px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>运营巡检中心</h1>
      <button id="runBtn" type="button">立即巡检</button>
    </header>

    <section class="hero">
      <span id="status" class="status">读取中</span>
      <p id="generated" class="meta">等待巡检报告。</p>
      <div class="stats">
        <div class="stat"><b id="total">--</b>检查项</div>
        <div class="stat"><b id="passed">--</b>通过</div>
        <div class="stat"><b id="failed">--</b>失败</div>
        <div class="stat"><b id="critical">--</b>关键</div>
      </div>
    </section>

    <section class="panel">
      <h2>巡检项</h2>
      <div id="checks"></div>
    </section>

    <section class="panel">
      <h2>下一步</h2>
      <div id="actions" class="meta">没有待处理项。</div>
    </section>
  </main>

  <script>
    const statusMap = {
      ok: '正常',
      warning: '有提醒',
      blocked: '需处理'
    };

    function render(report) {
      const status = document.querySelector('#status');
      status.className = `status ${report.status}`;
      status.textContent = statusMap[report.status] || report.status;
      document.querySelector('#generated').textContent = `最近巡检：${new Date(report.generatedAt).toLocaleString('zh-CN')}`;
      document.querySelector('#total').textContent = report.summary.total;
      document.querySelector('#passed').textContent = report.summary.passed;
      document.querySelector('#failed').textContent = report.summary.failed;
      document.querySelector('#critical').textContent = report.summary.critical;

      document.querySelector('#checks').replaceChildren(...report.checks.map((check) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<span></span><div><strong></strong><small></small></div><em></em>`;
        row.querySelector('span').className = check.ok ? 'ok' : 'bad';
        row.querySelector('span').textContent = check.ok ? '✓' : '!';
        row.querySelector('strong').textContent = check.name;
        row.querySelector('small').textContent = check.detail;
        row.querySelector('em').className = 'meta';
        row.querySelector('em').textContent = check.severity;
        return row;
      }));

      const actions = report.nextActions?.length ? report.nextActions.join('；') : '没有待处理项。';
      document.querySelector('#actions').textContent = actions;
    }

    async function load(path = '/api/v1/admin/ops-inspection') {
      const response = await fetch(path, { method: path.endsWith('/run') ? 'POST' : 'GET' });
      render(await response.json());
    }

    document.querySelector('#runBtn').addEventListener('click', () => load('/api/v1/admin/ops-inspection/run'));
    load();
  </script>
</body>
</html>
